# Syncs generated doc files from zopencommunity/meta (upstream) into this fork
# so that pages like /Vulnerabilities stay up-to-date without needing to re-run
# the full nightly pipeline (which requires Jenkins, zopen toolchain, etc.).
#
# Runs nightly at 03:00 UTC (after upstream nightly has had time to complete).
# Can also be triggered manually from the Actions tab.
name: Sync docs from upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download generated docs from upstream
        run: |
          UPSTREAM="https://raw.githubusercontent.com/zopencommunity/meta/main"

          # Generated markdown docs
          curl -fsSL "$UPSTREAM/docs/Vulnerabilities.md"         -o docs/Vulnerabilities.md
          curl -fsSL "$UPSTREAM/docs/vulnerabilities_rss.xml"    -o docs/vulnerabilities_rss.xml
          curl -fsSL "$UPSTREAM/docs/updatestatus.md"            -o docs/updatestatus.md
          curl -fsSL "$UPSTREAM/docs/upstreamstatus.md"          -o docs/upstreamstatus.md
          curl -fsSL "$UPSTREAM/docs/newly_released.md"          -o docs/newly_released.md  || true
          curl -fsSL "$UPSTREAM/docs/Progress.md"                -o docs/Progress.md        || true
          curl -fsSL "$UPSTREAM/docs/Guides/ToolsGuildMeetingLinks.md" -o docs/Guides/ToolsGuildMeetingLinks.md || true

          # Generated progress/quality chart images
          curl -fsSL "$UPSTREAM/docs/images/progress.png"             -o docs/images/progress.png          || true
          curl -fsSL "$UPSTREAM/docs/images/progress_summary.png"     -o docs/images/progress_summary.png  || true
          curl -fsSL "$UPSTREAM/docs/images/quality_part_1.png"       -o docs/images/quality_part_1.png    || true
          curl -fsSL "$UPSTREAM/docs/images/quality_part_2.png"       -o docs/images/quality_part_2.png    || true
          curl -fsSL "$UPSTREAM/docs/images/quality_part_3.png"       -o docs/images/quality_part_3.png    || true
          curl -fsSL "$UPSTREAM/docs/images/quality_part_4.png"       -o docs/images/quality_part_4.png    || true
          curl -fsSL "$UPSTREAM/docs/images/quality_part_5.png"       -o docs/images/quality_part_5.png    || true

          # Generated API JSON
          curl -fsSL "$UPSTREAM/docs/api/zopen_files.json"             -o docs/api/zopen_files.json
          curl -fsSL "$UPSTREAM/docs/api/zopen_releases.json"          -o docs/api/zopen_releases.json
          curl -fsSL "$UPSTREAM/docs/api/zopen_releases_latest.json"   -o docs/api/zopen_releases_latest.json
          curl -fsSL "$UPSTREAM/docs/api/zopen_vulnerability.json"     -o docs/api/zopen_vulnerability.json
          curl -fsSL "$UPSTREAM/docs/api/guild_meetings.json"          -o docs/api/guild_meetings.json        || true

      - name: Commit and push if anything changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/Vulnerabilities.md \
                  docs/vulnerabilities_rss.xml \
                  docs/updatestatus.md \
                  docs/upstreamstatus.md \
                  docs/newly_released.md \
                  docs/Progress.md \
                  docs/Guides/ToolsGuildMeetingLinks.md \
                  docs/images/progress.png \
                  docs/images/progress_summary.png \
                  docs/images/quality_part_1.png \
                  docs/images/quality_part_2.png \
                  docs/images/quality_part_3.png \
                  docs/images/quality_part_4.png \
                  docs/images/quality_part_5.png \
                  docs/api/zopen_files.json \
                  docs/api/zopen_releases.json \
                  docs/api/zopen_releases_latest.json \
                  docs/api/zopen_vulnerability.json \
                  docs/api/guild_meetings.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync generated docs from upstream [skip ci]"
            git push origin main
          fi
