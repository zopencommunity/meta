name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to analyze (owner/name). Defaults to current repo.'
        required: false
        type: string
        default: ""
      branch:
        description: 'Branch to analyze. Defaults to current branch.'
        required: false
        default: ""
        type: string
      languages:
        description: 'CodeQL languages to analyze (e.g., python, c-cpp, javascript)'
        required: false
        type: string
        default: 'python'
      build-mode:
        description: 'CodeQL build mode (none, manual, autobuild)'
        required: false
        type: string
        default: 'none'
  workflow_call:
    inputs:
      repo:
        required: false
        type: string
        default: ""
      branch:
        required: false
        default: ""
        type: string
      languages:
        description: 'CodeQL languages to analyze (e.g., c-cpp, python, javascript)'
        required: false
        type: string
        default: 'c-cpp'
      build-mode:
        description: 'CodeQL build mode (none, manual, autobuild)'
        required: false
        type: string
        default: 'none'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Determine Repository and Branch
        id: repo-info
        run: |
          repo="${{ inputs.repo }}"
          if [ -z "${repo}" ]; then
            repo="${{ github.repository }}"
          fi
          branch="${{ inputs.branch }}"
          if [ -z "${branch}" ]; then
            if [ "${{ github.event_name }}" == "pull_request" ] || [ "${{ github.event_name }}" == "pull_request_target" ]; then
              branch="${{ github.head_ref }}"
            else
              branch="${{ github.ref_name }}"
            fi
          fi
          echo "repo=${repo}" >> $GITHUB_OUTPUT
          echo "branch=${branch}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repo-info.outputs.repo }}
          ref: ${{ steps.repo-info.outputs.branch }}

      - name: Download and setup metaport
        run: |
          sudo apt-get update
          sudo apt-get install -y pax ncompress curl
          # Clone meta to a directory outside the workspace to avoid scanning it
          git clone https://github.com/zopencommunity/meta.git /tmp/meta
          # Create symlink in workspace for build process
          ln -s /tmp/meta meta
          echo "Metaport setup completed"

      - name: Create CodeQL config
        run: |
          mkdir -p .github/codeql
          cat > .github/codeql/codeql-config.yml << 'EOF'
          name: "CodeQL Config"

          paths-ignore:
            - meta/**
            - '**/meta/**'
            - '**/test-*.c'
            - '**/test-*.cpp'
            - '**/test-*.h'
            - '**/test-*.hpp'
            - '**/*-tests/**'
            - '**/tests/**'

          queries:
            - uses: security-and-quality
          EOF
          echo "CodeQL config created"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.languages || 'python' }}
          build-mode: ${{ inputs.build-mode || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Clone tool repository
        if: ${{ inputs.repo != '' }}
        run: |
          TARGET_REPO="${{ steps.repo-info.outputs.repo }}"
          echo "Target Repository: ${TARGET_REPO}"
          TOOL_NAME=$(basename "${TARGET_REPO}")
          echo "Tool Name: ${TOOL_NAME}"
          if [ -d "$TOOL_NAME" ]; then
            echo "Tool repository already exists, skipping clone"
          else
            git clone https://github.com/${TARGET_REPO}.git
            echo "Tool repository cloned: $TOOL_NAME"
          fi

      - name: Build with zopen
        if: ${{ inputs.repo != '' }}
        run: |
          export PATH="$PWD/meta/bin:$PATH"
          git config --global user.email "zopenCommunity@ibm.com"
          git config --global user.name "Zopen Community"

          TARGET_REPO="${{ steps.repo-info.outputs.repo }}"
          TOOL_NAME=$(basename "${TARGET_REPO}")
          echo "Tool Name: ${TOOL_NAME}"
          cd $TOOL_NAME
          zopen build -g
          ls -lrt

      - name: Perform CodeQL Analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results

      - name: Upload SARIF as artifact
        id: upload_sarif
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ inputs.languages || 'python' }}
          path: sarif-results/
          if-no-files-found: warn

      - name: Parse SARIF findings
        id: parse_sarif
        if: always()
        run: |
          SARIF_FILE=$(find sarif-results/ -name '*.sarif' 2>/dev/null | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "total=0"            >> "$GITHUB_OUTPUT"
            echo "error=0"           >> "$GITHUB_OUTPUT"
            echo "warning=0"         >> "$GITHUB_OUTPUT"
            echo "note=0"            >> "$GITHUB_OUTPUT"
            echo "sarif_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sarif_found=true" >> "$GITHUB_OUTPUT"
          python3 << PYEOF
          import json, os

          sarif_path  = "$SARIF_FILE"
          output_path = os.environ["GITHUB_OUTPUT"]

          with open(sarif_path) as f:
              sarif = json.load(f)

          counts = {"error": 0, "warning": 0, "note": 0}
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  level = result.get("level", "warning")
                  if level in counts:
                      counts[level] += 1
                  else:
                      counts["warning"] += 1  # treat unknown levels as warnings

          total = sum(counts.values())
          with open(output_path, "a") as out:
              out.write(f"total={total}\n")
              out.write(f"error={counts['error']}\n")
              out.write(f"warning={counts['warning']}\n")
              out.write(f"note={counts['note']}\n")
          PYEOF

      - name: Create Job Summary
        if: always()
        run: |
          LANGUAGE="${{ inputs.languages || 'python' }}"
          OUTCOME="${{ steps.codeql_analyze.outcome }}"
          TOTAL="${{ steps.parse_sarif.outputs.total }}"
          ERRORS="${{ steps.parse_sarif.outputs.error }}"
          WARNINGS="${{ steps.parse_sarif.outputs.warning }}"
          NOTES="${{ steps.parse_sarif.outputs.note }}"
          SARIF_FOUND="${{ steps.parse_sarif.outputs.sarif_found }}"

          if [ "$OUTCOME" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          {
            echo "# CodeQL Analysis Results"
            echo ""
            echo "## Execution Status: ${STATUS}"
            echo ""
            echo "## Configuration"
            echo ""
            echo "| Setting  | Value |"
            echo "|----------|-------|"
            echo "| Language | \`${LANGUAGE}\` |"
            echo "| Queries  | \`security-and-quality\` |"
            echo "| Runner   | \`${{ runner.os }}-${{ runner.arch }}\` |"
            echo "| Trigger  | \`${{ github.event_name }}\` |"
            echo ""
            echo "## Findings"
            echo ""
            if [ "$SARIF_FOUND" = "true" ]; then
              echo "| Severity  | Count |"
              echo "|-----------|------:|"
              echo "| Error     | ${ERRORS} |"
              echo "| Warning   | ${WARNINGS} |"
              echo "| Note      | ${NOTES} |"
              echo "| **Total** | **${TOTAL}** |"
            else
              echo "No SARIF results file found."
            fi
            echo ""
            echo "Full SARIF results available in artifacts: \`codeql-sarif-${LANGUAGE}\`"
            echo ""
            echo "---"
            echo "*Job summary generated at run-time*"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or Update Sticky PR Comment
        if: always() && steps.parse_sarif.outputs.sarif_found == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ steps.repo-info.outputs.repo }}
        run: |
          SARIF_FILE=$(find sarif-results/ -name '*.sarif' 2>/dev/null | head -n 1)
          if [ -z "$SARIF_FILE" ]; then
            echo "No SARIF file found, skipping PR comment."
            exit 0
          fi
          export SARIF_FILE
          echo "Using SARIF file: $SARIF_FILE"

          python3 << 'PYEOF'
          import json, os, sys, glob, urllib.request, urllib.error

          sarif_path = os.environ.get("SARIF_FILE", "")
          if not sarif_path or not os.path.exists(sarif_path):
              files = glob.glob("sarif-results/*.sarif") + glob.glob("sarif-results/**/*.sarif", recursive=True)
              if files:
                  sarif_path = files[0]
              else:
                  print("No SARIF file found.")
                  sys.exit(0)

          token = os.environ.get("GITHUB_TOKEN")
          target_repo = os.environ.get("TARGET_REPO") or os.environ.get("GITHUB_REPOSITORY")
          event_path = os.environ.get("GITHUB_EVENT_PATH")

          pr_number = None
          if event_path and os.path.exists(event_path):
              with open(event_path) as f:
                  event_data = json.load(f)
              if "pull_request" in event_data:
                  pr_number = event_data["pull_request"].get("number")
              elif "issue" in event_data and "pull_request" in event_data["issue"]:
                  pr_number = event_data["issue"].get("number")
              elif "number" in event_data:
                  pr_number = event_data.get("number")

          if not pr_number:
              print("Not a pull request context (no PR number found). Skipping PR comment.")
              sys.exit(0)

          if not token:
              print("GITHUB_TOKEN not available. Skipping PR comment.")
              sys.exit(0)

          # API Headers
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "CodeQL-PR-Commenter",
              "Content-Type": "application/json"
          }
          api_base = f"https://api.github.com/repos/{target_repo}"

          # 1. Fetch baseline open alerts from 'main' branch to calculate delta
          baseline_signatures = set()
          try:
              alerts_url = f"{api_base}/code-scanning/alerts?ref=refs/heads/main&state=open&per_page=100"
              req = urllib.request.Request(alerts_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  main_alerts = json.loads(resp.read().decode("utf-8"))
                  for alert in main_alerts:
                      rule_id = alert.get("rule", {}).get("id", "")
                      loc = alert.get("most_recent_instance", {}).get("location", {})
                      path = loc.get("path", "")
                      start_line = loc.get("start_line", 0)
                      if rule_id and path:
                          baseline_signatures.add(f"{rule_id}:{path}:{start_line}")
                          baseline_signatures.add(f"{rule_id}:{path}")
              print(f"Retrieved {len(baseline_signatures)} baseline signatures from main.")
          except Exception as e:
              print(f"Note: Could not query baseline alerts from main ({e}). Treating current findings as fresh.")

          # 2. Parse SARIF from current PR scan
          with open(sarif_path) as f:
              sarif = json.load(f)

          delta_counts = {"critical": 0, "high": 0, "medium": 0}
          delta_findings = []
          total_results_seen = 0

          for run in sarif.get("runs", []):
              rules_by_id = {}
              rules_by_idx = {}
              driver = run.get("tool", {}).get("driver", {})
              for idx, rule in enumerate(driver.get("rules", [])):
                  if "id" in rule:
                      rules_by_id[rule["id"]] = rule
                  rules_by_idx[idx] = rule

              for result in run.get("results", []):
                  total_results_seen += 1
                  rule_id = result.get("ruleId") or ""
                  rule_idx = result.get("ruleIndex")
                  rule_meta = rules_by_id.get(rule_id) or (rules_by_idx.get(rule_idx) if rule_idx is not None else {})
                  if not rule_id and rule_meta:
                      rule_id = rule_meta.get("id", "unknown")

                  msg = result.get("message", {}).get("text", "No description")
                  default_level = rule_meta.get("defaultConfiguration", {}).get("level")
                  prob_severity = rule_meta.get("properties", {}).get("problem.severity")
                  raw_level = result.get("level") or default_level or prob_severity or "warning"

                  sec_score = rule_meta.get("properties", {}).get("security-severity")
                  severity = None
                  if sec_score is not None:
                      try:
                          score = float(sec_score)
                          if score >= 9.0:
                              severity = "Critical"
                          elif score >= 7.0:
                              severity = "High"
                          elif score >= 4.0:
                              severity = "Medium"
                      except (ValueError, TypeError):
                          pass

                  if severity is None:
                      if raw_level in ("error", "critical"):
                          severity = "High"
                      elif raw_level in ("warning", "medium"):
                          severity = "Medium"

                  # Filter out anything not Critical, High, or Medium
                  if severity not in ("Critical", "High", "Medium"):
                      continue

                  # Extract location
                  uri = ""
                  start_line = 1
                  locs = result.get("locations", [])
                  if locs:
                      phys = locs[0].get("physicalLocation", {})
                      uri = phys.get("artifactLocation", {}).get("uri", "")
                      start_line = phys.get("region", {}).get("startLine", 1)

                  if uri.startswith("/"):
                      uri = uri.lstrip("/")

                  loc_str = f"`{uri}:{start_line}`" if uri else "unknown location"

                  # Check if this finding was already present in main (baseline debt)
                  is_in_baseline = False
                  if uri and (f"{rule_id}:{uri}:{start_line}" in baseline_signatures or f"{rule_id}:{uri}" in baseline_signatures):
                      is_in_baseline = True

                  if is_in_baseline:
                      print(f"Excluding baseline finding on main: {rule_id} at {uri}:{start_line}")
                      continue

                  delta_counts[severity.lower()] += 1
                  delta_findings.append({
                      "severity": severity,
                      "rule_id": rule_id,
                      "message": msg.strip().split("\n")[0],
                      "location": loc_str
                  })

          print(f"Total SARIF results examined: {total_results_seen}")
          print(f"Total net-new delta findings: {len(delta_findings)}")
          total_delta = sum(delta_counts.values())

          # 3. Build Markdown comment
          comment_tag = "<!-- codeql-pr-comment -->"
          lines = [
              comment_tag,
              "## 🛡️ CodeQL Delta Scan Summary",
              ""
          ]

          if total_delta == 0:
              lines.append("✅ **No net-new Critical, High, or Medium security findings introduced in this PR.**")
          else:
              lines.append("| Severity | Net-New Findings Introduced |")
              lines.append("| :--- | :---: |")
              if delta_counts["critical"] > 0:
                  lines.append(f"| 🔴 **Critical** | **+{delta_counts['critical']}** ⚠️ |")
              if delta_counts["high"] > 0:
                  lines.append(f"| 🟠 **High** | **+{delta_counts['high']}** ⚠️ |")
              if delta_counts["medium"] > 0:
                  lines.append(f"| 🟡 **Medium** | **+{delta_counts['medium']}** ⚠️ |")
              lines.append(f"| **Total Net-New** | **+{total_delta}** |")
              lines.append("")

              # Findings breakdown list
              display_findings = delta_findings[:10]
              lines.append("<details open>")
              lines.append(f"<summary><strong>📋 Net-New Findings Breakdown ({len(display_findings)} of {total_delta} shown)</strong></summary>")
              lines.append("")
              sev_icons = {"Critical": "🔴", "High": "🟠", "Medium": "🟡"}
              for f_item in display_findings:
                  icon = sev_icons.get(f_item["severity"], "⚠️")
                  lines.append(f"- {icon} **{f_item['severity']}** — `{f_item['rule_id']}` in {f_item['location']}")
                  lines.append(f"  > {f_item['message']}")
              lines.append("")
              lines.append("</details>")

          lines.append("")
          lines.append("---")
          lines.append("🔒 *Note: Pre-existing findings on `main` are excluded. Security alerts are officially closed in GitHub Security once the fix is merged into `main`.*")
          comment_body = "\n".join(lines)

          comments_url = f"{api_base}/issues/{pr_number}/comments"

          try:
              # Check for existing comment
              existing_id = None
              req = urllib.request.Request(comments_url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  existing_comments = json.loads(resp.read().decode("utf-8"))
                  for c in existing_comments:
                      if comment_tag in c.get("body", ""):
                          existing_id = c.get("id")
                          break

              if existing_id:
                  # Update existing comment
                  update_url = f"{api_base}/issues/comments/{existing_id}"
                  data = json.dumps({"body": comment_body}).encode("utf-8")
                  req = urllib.request.Request(update_url, data=data, headers=headers, method="PATCH")
                  with urllib.request.urlopen(req) as resp:
                      print(f"Successfully updated sticky PR comment #{existing_id} on PR #{pr_number}")
              else:
                  # Create new comment
                  data = json.dumps({"body": comment_body}).encode("utf-8")
                  req = urllib.request.Request(comments_url, data=data, headers=headers, method="POST")
                  with urllib.request.urlopen(req) as resp:
                      print(f"Successfully created sticky PR comment on PR #{pr_number}")
          except urllib.error.HTTPError as e:
              err_content = e.read().decode("utf-8", errors="ignore")
              print(f"Warning: Failed to post PR comment (HTTP {e.code}): {err_content}")
          except Exception as e:
              print(f"Warning: Failed to post PR comment: {e}")
          PYEOF
