name: "CodeQL"

on:
  workflow_call:
    inputs:
      languages:
        description: "CodeQL languages to analyze (e.g., c-cpp, python, javascript)"
        required: false
        type: string
        default: "c-cpp"
      build-mode:
        description: "CodeQL build mode (none, manual, autobuild)"
        required: false
        type: string
        default: "none"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and setup metaport
        run: |
          sudo apt-get update
          sudo apt-get install -y pax ncompress curl
          # Clone meta to a directory outside the workspace to avoid scanning it
          git clone https://github.com/zopencommunity/meta.git /tmp/meta
          # Create symlink in workspace for build process
          ln -s /tmp/meta meta
          echo "Metaport setup completed"

      - name: Create CodeQL config
        run: |
          mkdir -p .github/codeql
          cat > .github/codeql/codeql-config.yml << 'EOF'
          name: "CodeQL Config"

          paths-ignore:
            - meta/**
            - '**/meta/**'
            - '**/test-*.c'
            - '**/test-*.cpp'
            - '**/test-*.h'
            - '**/test-*.hpp'
            - '**/*-tests/**'
            - '**/tests/**'

          queries:
            - uses: security-and-quality
          EOF
          echo "CodeQL config created"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build with zopen
        if: ${{ inputs.build-mode != 'none' }}
        run: |
          export PATH="$PWD/meta/bin:$PATH"
          git config --global user.email "zopenCommunity@ibm.com"
          git config --global user.name "Zopen Community"
          
          echo "GitHub Repository: ${{ github.repository }}"
          echo "Repository already checked out in current directory"
          pwd
          ls -la
          
          # Build in current directory (repository was checked out in step 1)
          zopen build -g
          ls -lrt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
