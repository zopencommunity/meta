name: "BuildAndTest"

on:
  workflow_call:
    inputs:
      repo:
        required: false
        type: string
        default: ""
      branch:
        required: false
        default: ""
        type: string
      source_url:
        required: false
        default: ""
        type: string
      use_pr_source_url:
        required: false
        default: false
        type: boolean
      use_prbranch_as_build_branch:
        required: false
        default: false
        type: boolean
    secrets:
      JENKINS_USER:
        required: true
      JENKINS_API_TOKEN:
        required: true
jobs:
  trigger-jenkins-job:
    runs-on: ubuntu-latest
    steps:
      - name: Mock Jenkins success
        run: echo "Mocking Jenkins run for testing purposes"

  validate-bump:
    needs: trigger-jenkins-job
    if: ${{ success() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    outputs:
      is-bump: ${{ steps.check.outputs.is-bump }}
    steps:
      - name: Validate bump automation
        id: check
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Skip fork PRs
            if (pr.head.repo.fork) {
              console.log(`⏭️  Skipping merge: PR #${pr.number} is from a fork`);
              core.setOutput('is-bump', 'false');
              return;
            }

            // Check branch name matches bump- pattern
            const branch = pr.head.ref;
            if (!branch.startsWith('bump-')) {
              console.log(`⏭️  Skipping merge: PR #${pr.number} branch '${branch}' does not match bump-* pattern`);
              core.setOutput('is-bump', 'false');
              return;
            }

            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const email = commits.at(-1).commit.committer.email;
            if (email !== "bump-action@github") {
              console.log(`⏭️  Skipping merge: PR #${pr.number} not created by bump automation (committer: ${email})`);
              core.setOutput('is-bump', 'false');
            } else {
              core.setOutput('is-bump', 'true');
            }

  merge-pr:
    needs: validate-bump
    if: ${{ needs.validate-bump.outputs['is-bump'] == 'true' }}
    continue-on-error: true
    uses: ./.github/workflows/merge_pr.yml
    with:
      delete_branch: true
    secrets:
      MERGE_APP_ID: ${{ secrets.MERGE_APP_ID }}
      MERGE_APP_PRIVATE_KEY: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
