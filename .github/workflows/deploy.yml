# Workflow for building and deploying a VitePress site to GitHub Pages.
# Automatically selects the correct base path:
#   - zopencommunity/meta  (production) → BASE_PATH=/   (served at https://zopen.community/)
#   - forks (e.g. TejaswiniIBM/meta)   → BASE_PATH=/meta/ (served at https://<user>.github.io/meta/)
name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build with VitePress
        working-directory: docs
        # Use BASE_PATH=/ for the canonical upstream repo; /meta/ for all forks.
        run: |
          if [ "${{ github.repository }}" = "zopencommunity/meta" ]; then
            npm run docs:build:prod
          else
            npm run docs:build:dev
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
